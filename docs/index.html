<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Had Bank - Home Dashboard</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body class="dark-theme">
    <header class="app-header">
        <h1 class="brand-title">Had Bank</h1>
        <div class="header-controls">
            <!-- Theme Toggler (Sun / Moon) -->
            <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                <span class="theme-icon">☀️</span>
            </button>
            <!-- Language Selector Links -->
            <nav class="lang-nav" aria-label="Language Selection">
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="pt">PT</button>
                <button class="lang-btn" data-lang="es">ES</button>
            </nav>
        </div>
    </header>

    <main class="dashboard-container">
        <!-- Balance Card Display -->
        <section class="balance-card">
            <h2 id="txt-balance-title" class="section-label">Balance</h2>
            <div class="balance-amount">R$ <span id="display-balance">0.00</span></div>
            
            <!-- Minimalist Analytics Trend Graph SVG -->
            <div class="graph-wrapper" aria-hidden="true">
                <svg viewBox="0 0 500 120" class="trend-svg">
                    <polyline fill="none" stroke="var(--accent-graph)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
                        points="100,90 150,50 200,75 250,45 300,65 350,35 400,65 430,35" />
                    <!-- Graph nodes dots -->
                    <circle cx="100" cy="90" r="5" fill="var(--accent-graph)" />
                    <circle cx="150" cy="50" r="5" fill="var(--accent-graph)" />
                    <circle cx="200" cy="75" r="5" fill="var(--accent-graph)" />
                    <circle cx="250" cy="45" r="5" fill="var(--accent-graph)" />
                    <circle cx="300" cy="65" r="5" fill="var(--accent-graph)" />
                    <circle cx="350" cy="35" r="5" fill="var(--accent-graph)" />
                    <circle cx="400" cy="65" r="5" fill="var(--accent-graph)" />
                    <circle cx="430" cy="35" r="5" fill="var(--accent-orange)" />
                </svg>
            </div>
        </section>

        <!-- Quick Interaction Actions Menu Grid -->
        <section class="actions-grid" aria-label="Account Actions">
            <button id="btn-deposit" class="action-card card-green">
                <span class="action-icon">↑</span>
                <span id="txt-deposit" class="action-text">DEPOSIT</span>
            </button>
            <button id="btn-withdraw" class="action-card card-blue">
                <span class="action-icon">↓</span>
                <span id="txt-withdraw" class="action-text">WITHDRAW</span>
            </button>
            <button id="btn-statement" class="action-card card-red">
                <span class="action-icon">📋</span>
                <span id="txt-statement-btn" class="action-text">STATEMENT</span>
            </button>
        </section>

        <!-- Live Statement Ledger Terminal Console -->
        <section class="statement-console">
            <div class="console-header">
                <span class="decorator">==============</span>
                <span id="txt-statement-title">STATEMENT</span>
                <span class="decorator">==============</span>
            </div>
            <div id="statement-logs" class="console-body">
                <p>Welcome to Had Bank! Choose an option above to begin.</p>
            </div>
        </section>

        <!-- Promotion Footer Copy -->
        <footer class="promo-box">
            <p id="txt-promo-features" class="promo-sub">More features coming soon.</p>
            <p id="txt-promo-monetize" class="promo-main">Monetize with special fees!</p>
        </footer>
    </main>

    <!-- SLIDE MENU OVERLAY (All items from main.py) -->
    <div id="side-menu" class="menu-overlay" aria-hidden="true">
        <div class="menu-content">
            <div class="menu-header">
                <h2>Had Bank Menu</h2>
                <button id="close-menu" class="close-btn" aria-label="Close Menu">&times;</button>
            </div>
            <ul class="menu-list">
                <li><button class="menu-item-btn" id="menu-opt-d"><strong>[↑]</strong> <span class="lbl-d">Deposit</span></button></li>
                <li><button class="menu-item-btn" id="menu-opt-s"><strong>[↓]</strong> <span class="lbl-s">Withdraw</span></button></li>
                <li><button class="menu-item-btn" id="menu-opt-e"><strong>[📋]</strong> <span class="lbl-e">Statement</span></button></li>
                <li><button class="menu-item-btn" id="menu-opt-nc"><strong>[🆕]</strong> <span class="lbl-nc">New Account</span></button></li>
                <li><button class="menu-item-btn" id="menu-opt-lc"><strong>[📁]</strong> <span class="lbl-lc">List Accounts</span></button></li>
                <li><button class="menu-item-btn" id="menu-opt-nu"><strong>[👤]</strong> <span class="lbl-nu">New User</span></button></li>
                <li><button class="menu-item-btn" id="menu-opt-ci"><strong>[📈]</strong> <span class="lbl-ci">Calculate Investment</span></button></li>
                <li><button class="menu-item-btn" id="menu-opt-q"><strong>[❌]</strong> <span class="lbl-q">Quit / Reset</span></button></li>
            </ul>
        </div>
    </div>

    <!-- App Navigation Bar Control Footer -->
    <nav class="bottom-tab-bar" aria-label="Mobile Navigation">
        <button class="tab-item" id="nav-home">
            <span class="tab-icon">🏠</span>
            <span class="tab-label" data-i18n-nav="home">Home</span>
        </button>
        <button class="tab-item" id="nav-statement">
            <span class="tab-icon">📊</span>
            <span class="tab-label" data-i18n-nav="statement">Statement</span>
        </button>
        <button class="tab-item">
            <span class="tab-icon">❖</span>
            <span class="tab-label">Pix</span>
        </button>
        <button class="tab-item" id="open-menu">
            <span class="tab-icon">☰</span>
            <span class="tab-label" data-i18n-nav="menu">Menu</span>
        </button>
    </nav>

    <script src="./src/script.js"></script>
</body>
</html>
